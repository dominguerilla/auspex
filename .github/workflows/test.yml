name: Tests

on:
  push:
    branches: ["master", "develop", "feature/**"]
  pull_request:
    branches: ["master", "develop"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    # Postgres for the MCP server's job store (see docs/adr/0004). The MCP
    # tests skip if this is absent; here it is always present so they run.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: auspex
          POSTGRES_PASSWORD: auspex
          POSTGRES_DB: auspex
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://auspex:auspex@localhost:5432/auspex

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest -v
